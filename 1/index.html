<!DOCTYPE html>
<html lang="ka">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>უნარების სია</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-blue-600 p-6 flex justify-center items-center min-h-screen">

    <div class="w-full max-w-md bg-white rounded-lg shadow p-6">
        <h1 class="text-xl font-bold mb-4">ჩემი უნარების სია</h1>


        <div class="mb-4 flex justify-between items-center bg-gray-50 p-3 rounded">
            <span id="status-message" class="text-sm text-gray-600">სია ჯერ ცარიელია</span>
            <span id="counter" class="font-bold text-lg">0</span>
        </div>

        <div class="mb-4 flex gap-2">
            <input id="skill-input" type="text" placeholder="შეიყვანე უნარი..."
                class="flex-1 border rounded px-3 py-2 text-sm focus:outline-none focus:border-blue-500" />
            <button id="add-btn" class="bg-blue-500 text-white px-4 py-2 rounded text-sm hover:bg-blue-600">
                დამატება
            </button>
        </div>
        <p id="error-message" class="text-xs text-red-500 mb-4 hidden">გთხოვთ შეიყვანოთ ტექსტი!</p>


        <div class="flex justify-between items-center mb-2">
            <span class="text-sm font-semibold">უნარები:</span>
            <button id="clear-btn" class="text-xs text-red-500 hover:underline">ყველას წაშლა</button>
        </div>

        <ul id="skills-list" class="space-y-2"></ul>

    </div>

    <script src="script.js"></script>
</body>

</html>
